
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Store - Home</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      color: #1f2937;
    }

    nav {
      background: #111827;
      padding: 14px 24px;
      display: flex;
      gap: 20px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
    }

    section {
      padding: 48px 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero {
      background: #eef2ff;
      max-width: none;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    button {
      background: #4f46e5;
      color: #fff;
      border: 0;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background: #16a34a;
      cursor: default;
    }

    #cart-message {
      text-align: center;
      font-weight: bold;
      color: #15803d;
      margin: 16px 0;
    }

    footer {
      background: #f3f4f6;
      padding: 40px 24px;
      text-align: center;
      margin-top: 400px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="/demo/index.html">Home</a>
    <a href="/demo/pricing.html">Pricing</a>
  </nav>

  <section class="hero">
    <h1>Welcome to the Demo Store</h1>
    <p>Click anywhere on this page. Every click and page view is tracked.</p>
    <button onclick="shopNow()">Shop now</button>
  </section>

  <section>
    <h2>Featured products</h2>

    <p id="cart-message" aria-live="polite"></p>

    <div class="grid">
      <div class="card">
        <h3>Sneakers</h3>
        <button onclick="addToCart('Sneakers', this)">Add to cart</button>
      </div>

      <div class="card">
        <h3>Backpack</h3>
        <button onclick="addToCart('Backpack', this)">Add to cart</button>
      </div>

      <div class="card">
        <h3>Watch</h3>
        <button onclick="addToCart('Watch', this)">Add to cart</button>
      </div>
    </div>
  </section>

  <footer>
    Footer area – scroll down and click here too.
  </footer>

  <script>
    let cartCount = 0;

    function addToCart(product, button) {
      cartCount++;

      const message = document.getElementById('cart-message');
      message.textContent =
        product + ' added to cart! Total items: ' + cartCount;

      const originalText = button.textContent;
      button.textContent = 'Added!';
      button.disabled = true;

      setTimeout(() => {
        button.textContent = originalText;
        button.disabled = false;
      }, 1200);
    }
function shopNow() {
  const products = document.querySelector('.grid');

  if (!products) {
    alert('Products section not found!');
    return;
  }

  products.scrollIntoView({ behavior: 'auto', block: 'start' });

  products.style.outline = '3px solid #4f46e5';
  products.style.backgroundColor = '#eef2ff';

  setTimeout(() => {
    products.style.outline = '';
    products.style.backgroundColor = '';
  }, 1500);
}
  </script>

  <!-- Analytics tracking: keep this script -->
  <script src="/tracker.js" data-endpoint="/api/events"></script>
</body>
</html>
